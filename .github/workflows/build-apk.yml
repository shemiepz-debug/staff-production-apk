

name: Build Staff Production APK

on:
workflow_dispatch:
push:
branches: [ main, master ]

jobs:
build-apk:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Set up Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Install dependencies
    run: npm install

  - name: Add Android platform & sync web app
    run: |
      npx cap add android
      npx cap sync android

  - name: Build Debug APK
    working-directory: android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Rename APK
    run: cp android/app/build/outputs/apk/debug/app-debug.apk Staff-Production-App-v5.apk

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Staff-Production-App-v5-APK
      path: Staff-Production-App-v5.apk

```
